name: release-builds

# Builds VST3/AU/Standalone for macOS (universal) and VST3/Standalone for
# Windows, and attaches the zips to the GitHub release for the given tag.
# Runs on tag push, or manually (Actions -> release-builds -> Run workflow)
# against an existing release tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach builds to (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DSAPPKEYS_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build build --config Release -j3
      - name: Package
        run: |
          ART="build/SappKeysPlugin_artefacts/Release"
          STAGE="SappKeys-$TAG-macOS-universal"
          mkdir -p "$STAGE"
          cp -R "$ART/VST3/SappKeys.vst3" "$STAGE/"
          cp -R "$ART/AU/SappKeys.component" "$STAGE/"
          cp -R "$ART/Standalone/SappKeys.app" "$STAGE/"
          cp "build/sappkeys" "$STAGE/" || true
          cat > "$STAGE/INSTALL.txt" <<'EOF'
SappKeys — macOS (universal: Apple Silicon + Intel)

1. Copy SappKeys.vst3      -> ~/Library/Audio/Plug-Ins/VST3/
2. Copy SappKeys.component -> ~/Library/Audio/Plug-Ins/Components/
3. SappKeys.app is the standalone version.

Unsigned build: after copying, clear quarantine once:
  xattr -rc ~/Library/Audio/Plug-Ins/VST3/SappKeys.vst3 ~/Library/Audio/Plug-Ins/Components/SappKeys.component
Then rescan plugins in your DAW.
EOF
          zip -qry "$STAGE.zip" "$STAGE"
      - name: Upload to release
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes || true
          gh release upload "$TAG" "SappKeys-$TAG-macOS-universal.zip" --clobber

  windows:
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DSAPPKEYS_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build build --config Release
      - name: Package
        shell: pwsh
        run: |
          $art = "build/SappKeysPlugin_artefacts/Release"
          $stage = "SappKeys-$env:TAG-Windows-x64"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item -Recurse "$art/VST3/SappKeys.vst3" "$stage/"
          Copy-Item "$art/Standalone/SappKeys.exe" "$stage/"
          Copy-Item "build/Release/sappkeys.exe" "$stage/" -ErrorAction SilentlyContinue
          @"
SappKeys — Windows x64

1. Copy the SappKeys.vst3 folder to: C:\Program Files\Common Files\VST3\
2. SappKeys.exe is the standalone version — run it from anywhere.
Then rescan plugins in your DAW.
"@ | Set-Content "$stage/INSTALL.txt"
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"
      - name: Upload to release
        shell: pwsh
        run: |
          gh release view "$env:TAG" 2>$null; if ($LASTEXITCODE -ne 0) { gh release create "$env:TAG" --generate-notes }
          gh release upload "$env:TAG" "SappKeys-$env:TAG-Windows-x64.zip" --clobber
